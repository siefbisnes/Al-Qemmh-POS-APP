{% extends "base.html" %}
{% block title %}إعدادات القرآن - {{ store_name }}{% endblock %}

{% block content %}
<div class="quran-page">

  <a href="{{ url_for('quran.index') }}" class="quran-back-link">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6" style="transform-origin:center; transform: scaleX(-1);"></polyline></svg>
    <span>مكتبة القرآن</span>
  </a>

  <div class="quran-header">
    <div class="quran-header-titles">
      <h1 class="quran-title">إعدادات القرآن</h1>
      <p class="quran-subtitle">التشغيل التلقائي، الشيخ الرئيسي، الصوت، والتكرار</p>
    </div>
  </div>

  <section id="quran-settings" class="quran-settings-card">
    <div class="quran-settings-box">

      <div class="quran-settings-row">
        <label for="quranAutoplayToggle">تشغيل القرآن تلقائيًا عند فتح البرنامج</label>
        <label class="quran-toggle">
          <input type="checkbox" id="quranAutoplayToggle">
          <span class="quran-toggle-track"></span>
        </label>
      </div>

      <div class="quran-settings-row">
        <label for="quranDefaultReciterSelect">الشيخ الرئيسي</label>
        <select id="quranDefaultReciterSelect"></select>
      </div>

      <div class="quran-settings-row">
        <label for="quranVolumeSlider">مستوى الصوت</label>
        <input type="range" id="quranVolumeSlider" min="0" max="100" value="20">
      </div>

      <div class="quran-settings-row">
        <label for="quranRepeatSelect">التكرار</label>
        <select id="quranRepeatSelect">
          <option value="off">بدون تكرار</option>
          <option value="track">تكرار السورة</option>
          <option value="playlist">تكرار القائمة</option>
        </select>
      </div>

      <div class="quran-settings-row quran-settings-row-stacked">
        <label for="quranFolderInput">مجلد القرآن</label>
        <div class="quran-folder-row">
          <input type="text" id="quranFolderInput">
          <button type="button" class="btn btn-sm" id="quranFolderSaveBtn">حفظ</button>
        </div>
      </div>
      <p class="quran-folder-status" id="quranFolderStatus"></p>

    </div>
  </section>
  {% include "_quran_player.html" %}
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/quran-settings.js') }}"></script>
{% endblock %}
