<section class="quran-player" id="quranPlayerBar" aria-label="مشغل القرآن">
  <div class="quran-player-track">
    <div class="quran-player-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="16" cy="16" r="3"></circle></svg></div>
    <div class="quran-player-titles">
      <span class="quran-player-surah" id="quranPlayerSurah">—</span>
      <span class="quran-player-reciter" id="quranPlayerReciter">—</span>
    </div>
  </div>
  <div class="quran-player-center">
    <div class="quran-player-controls">
      <button type="button" class="quran-player-btn" id="quranPlayerPrev" title="السابق" aria-label="السابق"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg></button>
      <button type="button" class="quran-player-btn quran-player-btn-main" id="quranPlayerToggle" title="تشغيل/إيقاف" aria-label="تشغيل/إيقاف">
        <svg class="icon-play" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg><svg class="icon-pause" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" hidden><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
      </button>
      <button type="button" class="quran-player-btn" id="quranPlayerNext" title="التالي" aria-label="التالي"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"></path></svg></button>
    </div>
    <div class="quran-player-progress">
      <span class="quran-player-time" id="quranPlayerCurrentTime">٠:٠٠</span>
      <input type="range" id="quranPlayerSeek" class="quran-player-seek" min="0" max="1000" value="0">
      <span class="quran-player-time" id="quranPlayerDuration">٠:٠٠</span>
    </div>
  </div>
  <div class="quran-player-extra">
    <button type="button" class="quran-player-btn quran-player-btn-sm" id="quranPlayerRepeat" title="التكرار" aria-label="التكرار"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg><span class="quran-player-repeat-badge" id="quranPlayerRepeatBadge" hidden>1</span></button>
    <label class="quran-player-volume-wrap" title="مستوى الصوت">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      <input type="range" id="quranPlayerVolume" class="quran-player-volume" min="0" max="100" value="20" aria-label="مستوى الصوت">
    </label>
  </div>
</section>
